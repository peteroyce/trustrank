services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustrank
      POSTGRES_PASSWORD: trustrank
      POSTGRES_DB: trustrank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
